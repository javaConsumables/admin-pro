server:
  port: 8080

spring:
  application:
    name: admin-pro
  # Day 1-8 暂不依赖 Redis：排除 Redisson 自动配置（无 Redis 也可启动）
  # Day 9-10 接入 Redis 缓存/分布式锁时删除本行
  autoconfigure:
    exclude: org.redisson.spring.starter.RedissonAutoConfigurationV2
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/admin_pro?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 默认不设密码；如需密码：set REDIS_PASSWORD=xxx 即可（null 默认值避免 Redisson 误发 AUTH）
      password: ${REDIS_PASSWORD:#{null}}
      database: 0
      timeout: 5s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.adminpro: debug
