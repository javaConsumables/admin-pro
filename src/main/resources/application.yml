server:
  port: 8080

spring:
  application:
    name: admin-pro
  profiles:
    # local: local development; prod: production deployment
    active: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      database: 0
      timeout: 5s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

adminpro:
  jwt:
    secret: 6a9cc3941eb147ffa9265e848e2427303cb5233bb447f56dfc19a02501a2ec79
    expire-seconds: 7200
  file:
    upload-dir: ./uploads
