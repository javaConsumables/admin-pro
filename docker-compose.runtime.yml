# 服务器运行时部署（使用预构建 jar，避免服务器上 Maven 构建）
services:
  mysql:
    image: mysql:8.0
    container_name: admin-pro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: admin_pro
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: admin-pro-redis

  app:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    container_name: admin-pro-app
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/admin_pro?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: "6379"

volumes:
  mysql-data:
