name: Deploy to Aliyun ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Maven cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build jar
        timeout-minutes: 12
        run: mvn -B -ntp -DskipTests package

      - name: Save Maven cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Install sshpass
        timeout-minutes: 3
        run: sudo apt-get update -q && sudo apt-get install -y -q sshpass

      - name: Upload jar to server
        timeout-minutes: 5
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o TCPKeepAlive=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no -o GSSAPIAuthentication=no"
          LOCAL_JAR="target/admin-pro-0.0.1-SNAPSHOT.jar"
          REMOTE_JAR="/opt/admin-pro/admin-pro-0.0.1-SNAPSHOT.jar"

          for attempt in 1 2 3; do
            echo "Upload attempt ${attempt}/3"
            if [ "${attempt}" -eq 1 ]; then
              SFTP_COMMAND="put ${LOCAL_JAR} ${REMOTE_JAR}"
            else
              SFTP_COMMAND="reput ${LOCAL_JAR} ${REMOTE_JAR}"
            fi

            if printf '%s\n' "${SFTP_COMMAND}" | timeout --kill-after=10s 90s \
              sshpass -e sftp ${SSH_OPTS} "${SERVER_USER}@${SERVER_HOST}"; then
              echo "JAR UPLOADED"
              exit 0
            fi
            echo "Upload attempt ${attempt} failed"
            sleep 5
          done
          echo "JAR UPLOAD FAILED"
          exit 1

      - name: Restart app & health check
        timeout-minutes: 3
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no -o GSSAPIAuthentication=no \
            "${SERVER_USER}@${SERVER_HOST}" '
            set -e
            cd /opt/admin-pro
            mv -f admin-pro-0.0.1-SNAPSHOT.jar app.jar
            docker compose -f docker-compose.runtime.yml up -d --build app
            for i in $(seq 1 12); do
              if curl -s --max-time 3 http://127.0.0.1:8080/api/health | grep -q "\"code\":200"; then
                echo "HEALTH OK after $((i*3))s"
                exit 0
              fi
              sleep 3
            done
            echo "DEPLOY FAILED - app not healthy"
            docker compose -f docker-compose.runtime.yml logs --tail 50 app
            exit 1
          '
