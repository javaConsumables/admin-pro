name: Deploy to Aliyun ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build jar
        run: mvn -B -q -DskipTests package

      - name: Check secrets (diagnose)
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then echo "::error::SERVER_HOST 为空"; exit 1; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then echo "::error::SERVER_USER 为空"; exit 1; fi
          if [ -z "${{ secrets.SERVER_PASSWORD }}" ]; then echo "::error::SERVER_PASSWORD 为空"; exit 1; fi
          H="${{ secrets.SERVER_HOST }}"
          echo "host 长度: ${#H}（正确应为 13: 106.15.202.136，若有空格请重新填写 Secret）"

      - name: Install sshpass
        run: sudo apt-get update -q && sudo apt-get install -y -q sshpass

      - name: Upload jar to server
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            target/admin-pro-0.0.1-SNAPSHOT.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/admin-pro/
          echo "JAR UPLOADED"

      - name: Restart app & health check
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            set -e
            cd /opt/admin-pro
            mv -f admin-pro-0.0.1-SNAPSHOT.jar app.jar
            docker compose -f docker-compose.runtime.yml up -d --build app
            for i in $(seq 1 12); do
              if curl -s --max-time 3 http://127.0.0.1:8080/api/health | grep -q "\"code\":200"; then
                echo "HEALTH OK after $((i*3))s"
                exit 0
              fi
              sleep 3
            done
            echo "DEPLOY FAILED - app not healthy"
            docker compose -f docker-compose.runtime.yml logs --tail 50 app
            exit 1
          '
