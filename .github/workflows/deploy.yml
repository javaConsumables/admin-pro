name: Deploy to Aliyun ECS

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 部署分支由 deploy-branch.txt 控制（内容：main 或 dev），改文件即切换
      - name: Check deploy branch config
        run: |
          CONFIG=$(cat deploy-branch.txt | tr -d ' \r\n')
          echo "配置的部署分支: $CONFIG"
          echo "当前分支: ${{ github.ref_name }}"
          if [ "$CONFIG" = "${{ github.ref_name }}" ]; then
            echo "DEPLOY_ENABLED=true" >> "$GITHUB_ENV"
            echo "命中配置，执行部署"
          else
            echo "跳过部署（配置分支 $CONFIG ≠ 当前分支 ${{ github.ref_name }}）"
          fi

      - name: Setup JDK 17
        if: env.DEPLOY_ENABLED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build jar
        if: env.DEPLOY_ENABLED == 'true'
        run: mvn -B -q -DskipTests package

      - name: Install sshpass
        if: env.DEPLOY_ENABLED == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q sshpass

      - name: Upload jar to server
        if: env.DEPLOY_ENABLED == 'true'
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            target/admin-pro-0.0.1-SNAPSHOT.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/admin-pro/
          echo "JAR UPLOADED"

      - name: Restart app & health check
        if: env.DEPLOY_ENABLED == 'true'
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            set -e
            cd /opt/admin-pro
            mv -f admin-pro-0.0.1-SNAPSHOT.jar app.jar
            docker compose -f docker-compose.runtime.yml up -d --build app
            for i in $(seq 1 12); do
              if curl -s --max-time 3 http://127.0.0.1:8080/api/health | grep -q "\"code\":200"; then
                echo "HEALTH OK after $((i*3))s"
                exit 0
              fi
              sleep 3
            done
            echo "DEPLOY FAILED - app not healthy"
            docker compose -f docker-compose.runtime.yml logs --tail 50 app
            exit 1
          '
