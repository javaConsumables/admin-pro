name: Deploy to Aliyun ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build jar
        run: mvn -B -q -DskipTests package

      - name: Publish jar to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest 'target/admin-pro-0.0.1-SNAPSHOT.jar#admin-pro.jar' \
            --title "latest" --notes "CI auto build $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          || gh release upload latest 'target/admin-pro-0.0.1-SNAPSHOT.jar#admin-pro.jar' --clobber 2>/dev/null || true
          echo "Release 资产: https://github.com/javaConsumables/admin-pro/releases/latest/download/admin-pro.jar"
