name: Deploy to Aliyun ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build jar
        run: mvn -B -q -DskipTests package

      - name: Check secrets (diagnose)
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then echo "::error::SERVER_HOST 为空，请检查 Secrets"; exit 1; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then echo "::error::SERVER_USER 为空，请检查 Secrets"; exit 1; fi
          if [ -z "${{ secrets.SERVER_PASSWORD }}" ]; then echo "::error::SERVER_PASSWORD 为空，请检查 Secrets"; exit 1; fi
          echo "Secrets 已配置（内容已脱敏）"

      - name: Diagnose host & port (diagnose)
        run: |
          H="${{ secrets.SERVER_HOST }}"
          echo "host 长度: ${#H}（正确应为 13: 106.15.202.136）"
          if [ "${#H}" = "13" ]; then echo "长度正确"; else echo "长度异常 → SERVER_HOST 可能有空格/拼写错误"; fi
          timeout 10 bash -c "exec 3<>/dev/tcp/$H/22 && echo PORT_22_OPEN" 2>&1 || echo "PORT_22_FAIL（连不上 → SERVER_HOST 可能填错）"

      - name: Test SSH connectivity (diagnose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "SSH CONNECT OK"
            hostname
            whoami

      - name: Upload jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "target/admin-pro-0.0.1-SNAPSHOT.jar"
          target: "/opt/admin-pro"

      - name: Restart app container & health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /opt/admin-pro
            mv -f admin-pro-0.0.1-SNAPSHOT.jar app.jar
            docker compose -f docker-compose.runtime.yml up -d --build app
            for i in $(seq 1 12); do
              if curl -s --max-time 3 http://127.0.0.1:8080/api/health | grep -q '"code":200'; then
                echo "HEALTH OK after $((i*3))s"
                exit 0
              fi
              sleep 3
            done
            echo "DEPLOY FAILED - app not healthy"
            docker compose -f docker-compose.runtime.yml logs --tail 50 app
            exit 1