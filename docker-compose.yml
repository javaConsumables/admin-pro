# 本地基础设施：MySQL 8 + Redis 7
# 用法：docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: admin-pro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: admin_pro
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: admin-pro-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
