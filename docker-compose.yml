# admin-pro 一键部署：MySQL + Redis + 应用
# 用法：docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: admin-pro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: admin_pro
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: admin-pro-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: admin-pro-app
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/admin_pro?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - app-uploads:/app/uploads

volumes:
  mysql-data:
  app-uploads:
